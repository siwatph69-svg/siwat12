<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - แนะนำตัว</title>
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้า Google Font สำหรับสไตล์ Modern (Prompt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- การ์ดโปรไฟล์ตรงกลางหน้าเว็บ -->
    <div class="profile-card">
        
        <!-- ส่วนรูป Profile (สามารถนำรูปภาพของคุณมาวางไว้โฟลเดอร์เดียวกันและตั้งชื่อว่า profile.jpg ได้) -->
        <img src="profile.jpg" alt="รูปโปรไฟล์ของฉัน" class="profile-img">

        <!-- หัวข้อหลักแสดงชื่อ -->
        <h1>ศิวัฒน์ พนมเจริญกิจ (พีท)</h1>

        <!-- ข้อความต้อนรับ -->
        <p class="welcome-text">ยินดีต้อนรับสู่เว็บไซต์แนะนำตัวเองของผมครับ!</p>

        <!-- ข้อความแนะนำตัวสั้น ๆ -->
        <p>สวัสดีครับ ผมกำลังเริ่มต้นเรียนรู้การเขียนเว็บไซต์ด้วย HTML และ CSS</p>

        <!-- ปุ่มสำหรับไปหน้า About -->
        <div class="button-container">
            <a href="about.html" class="btn">รู้จักฉันเพิ่มเติม</a>
        </div>

    </div>

</body>
</html>
