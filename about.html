<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกี่ยวกับฉัน</title>
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้า Google Font สำหรับสไตล์ Modern (Prompt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- การ์ดข้อมูลเกี่ยวกับฉัน -->
    <div class="profile-card">
        
        <!-- ส่วนหัวข้อเกี่ยวกับฉัน -->
        <h2>เกี่ยวกับฉัน</h2>
        <div class="info-group">
            <p><strong>ชื่อ-นามสกุล:</strong> ศิวัฒน์ พนมเจริญกิจ</p>
            <p><strong>ชื่อเล่น:</strong> พีท</p>
            <p><strong>มหาวิทยาลัย:</strong> มหาวิทยาลัยนเรศวร</p>
            <p><strong>แนะนำตัว:</strong> ชอบกินไก่ทอด</p>
        </div>

        <!-- รายการงานอดิเรก -->
        <h2>งานอดิเรกของฉัน</h2>
        <ul>
            <li>เล่นเกม</li>
            <li>ฟังเพลง</li>
            <li>ดูหนัง</li>
        </ul>

        <!-- รายการสิ่งที่ชอบ -->
        <h2>สิ่งที่ฉันชอบ</h2>
        <ul>
            <li>แมว</li>
            <li>เกม</li>
            <li>การ์ตูน</li>
            <li>ถ่ายรูป</li>
        </ul>

        <!-- ปุ่มกลับหน้าแรก -->
        <div class="button-container">
            <a href="index.html" class="btn">กลับหน้าแรก</a>
        </div>

    </div>

</body>
</html>
